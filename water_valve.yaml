esphome:
  name: water-valve
  friendly_name: Water Valve

esp8266:
  board: d1_mini

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret water_valve_encryption_key

ota:
  - platform: esphome
    password: !secret water_valve_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Water-Valve Fallback Hotspot"
    password: !secret water_valve_ap_password

captive_portal:

switch:
  - platform: gpio
    name: "Water Valve Motor"
    pin: D6
    id: switch_relay
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:water-pump
    on_turn_on:
    - logger.log: "Valve Turned On!"
    on_turn_off:
    - logger.log: "Valve Turned Off!"

binary_sensor:
  - platform: gpio
    pin:
      number: D5
      mode:
        input: true
        pullup: true
    name:  "Water Valve Button"
    on_press:
      - switch.toggle: switch_relay
    